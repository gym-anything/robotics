[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-anything-robotics"
version = "0.1.0"
description = "Gym-Anything for Robotics: coding agents build realistic robotics simulations. Includes the RoboWorld benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
]
# Exact versions of the reference runtime are in requirements/newton.txt.
dependencies = [
  "newton==1.5.0",
  "warp-lang==1.16.0",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "numpy>=2.2,<3",
  "scipy>=1.15",
  "trimesh>=4.6",
  "pillow>=11",
  "usd-core>=25.5",
  "shapely>=2.1",
  "matplotlib>=3.10",
  "zstandard>=0.23",
  "gymnasium>=1.2",
  "mapbox-earcut>=1.0",
  "PyOpenGL>=3.1",
  "GitPython>=3.1",  # robot model downloads through newton.utils.download_asset
  "pycollada>=0.9",  # COLLADA robot meshes, read through trimesh
]

[project.optional-dependencies]
barcode-scanning = ["zxing-cpp>=3.1"]
label-application = ["python-barcode>=0.16", "zxing-cpp>=3.1", "pypardiso>=0.4"]
gift-bags = ["ipctk==1.6.0", "pypardiso>=0.4", "threadpoolctl>=3.6"]
deposit-cans = ["ipctk==1.6.0", "pypardiso>=0.4"]
drilling = ["ruckig>=0.19", "manifold3d>=3.5"]
concrete-finishing = ["ruckig>=0.19", "manifold3d>=3.5"]
lockkey = ["manifold3d>=3.5"]  # watertight lock meshes (lockkey/lock_mesh.py)
titration = ["mitsuba==3.8.0", "drjit==1.3.1"]  # the default volume renderer (titrate/newton15/volume_transport.py)
creation-audit = ["google-genai>=2.7.0"]
all = [
  "zxing-cpp>=3.1", "python-barcode>=0.16", "pypardiso>=0.4", "ipctk==1.6.0", "threadpoolctl>=3.6",
  "ruckig>=0.19", "manifold3d>=3.5", "mitsuba==3.8.0", "drjit==1.3.1", "google-genai>=2.7.0",
]
dev = ["pytest>=8"]

[project.scripts]
gar = "gym_anything_robotics.cli:main"
gar-http = "gym_anything_robotics.http_server:main"

[project.urls]
Repository = "https://github.com/gym-anything/robotics"

# The core packages live in src/ and the RoboWorld environments in benchmarks/roboworld/environments/.
[tool.setuptools.packages.find]
where = ["src", "benchmarks/roboworld/environments"]
include = [
  "gym_anything_robotics*", "robots*", "barcode_scanning*", "classroom_arrangement*", "concrete_finishing*",
  "deposit_cans*", "drilling*", "filleting*", "football*", "forklift*", "gift_bags*", "ingredient_mixing*",
  "label_application*", "laundry*", "lockkey*", "painting*", "pencap*", "percussion*", "sewing*",
  "soil_excavation*", "surface_rinsing*", "syringe_handling*", "tighten_codex*", "titrate*", "welding*",
  "whiteboard*", "wine_pouring*", "wiping*", "sweeping*", "control_cable*",
]
exclude = ["*.tests", "*.tests.*"]
namespaces = true

[tool.setuptools.package-data]
"*" = [
  "*.json", "*.jsonl", "*.npz", "*.png", "*.jpg", "*.mdl", "*.kit", "*.usd", "*.urdf", "*.srdf", "*.txt", "*.md",
  "*.html", "*.js", "*.css",
  "**/*.json", "**/*.jsonl", "**/*.npz", "**/*.png", "**/*.jpg", "**/*.mdl", "**/*.usd", "**/*.urdf", "**/*.srdf",
  "**/*.txt", "**/*.md", "**/*.html", "**/*.js", "**/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
